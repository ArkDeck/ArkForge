// ArkForge local IPC — normative wire schema.
//
// architecture.md 15. Protobuf carries wire compatibility; deterministic CBOR
// carries security digests (15.4). Nothing in this file is a security digest:
// digests travel as opaque 32-byte fields that were computed elsewhere.
//
// The codec in `crates/arkforge-ipc/src/messages.rs` is hand-written against
// this file (see docs/decisions/AFD-0001-zero-dependency-core.md). This file is
// the contract; the codec's tests assert it round-trips.
//
// Evolution rules (IPC-001, protobuf.dev):
//   - field numbers are never reused;
//   - a new field is optional and additive;
//   - an unknown FIELD is skipped (forward compatibility);
//   - an unknown ENUM VALUE is a hard error, not a default
//     (architecture.md 15.2 "unknown enum fail closed").

syntax = "proto3";

package arkforge.ipc.v1;

// ---------------------------------------------------------------------------
// Session
// ---------------------------------------------------------------------------

// Which socket a peer connected on. The public socket never carries
// startExecution (architecture.md 15.2).
enum SessionKind {
  SESSION_KIND_UNSPECIFIED = 0;
  // Read-only. Inspect, discover, probe, and assessment-only materialization.
  SESSION_KIND_PUBLIC = 1;
  // Holds the handle/secret the authority passed when it started the daemon.
  SESSION_KIND_CONTROLLER = 2;
}

message Hello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  SessionKind session_kind = 3;
}

message HelloAck {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  SessionKind session_kind = 3;
  string daemon_version = 4;
  // Set when the daemon refuses the handshake.
  string refusal = 5;

  // Whether this daemon could execute any plan at all, and what is missing.
  //
  // Carried on the handshake because these are standing facts, established at
  // startup and unchangeable by a request: an authority paired, and a
  // toolchain bound (since NRU-004 the daemon binds its own native
  // implementation and measures its own executable). A client learns them
  // before it materializes a plan it could not run, rather than after it has
  // created a job.
  //
  // `execution_blockers` holds stable codes (NO_PAIRED_AUTHORITY,
  // NO_DISPATCHER). It is empty exactly when `execution_ready` is true.
  bool execution_ready = 6;
  repeated string execution_blockers = 7;

  // The bound toolchain's identity — since NRU-004 this is
  // "arkforged-native-rockusb" plus the daemon's own build digest, measured
  // at startup. A client compares `toolchain_sha256` against the toolchain
  // its plan was materialized for: the digest is part of the maturity
  // combination (architecture.md 12.3), so a mismatch means the pairing was
  // never published. The daemon refuses that pairing too, at startExecution;
  // this is so a client need not find out by being refused.
  //
  // Historical caveat, kept for the vendor era this field carried a child
  // tool's digest: byte equality was not a promise the tool runs — a
  // quarantined executable with the right digest hangs in dyld (AD-015).
  string toolchain_id = 8;
  string toolchain_sha256 = 9;
}

// ---------------------------------------------------------------------------
// API surface (architecture.md 15.3)
// ---------------------------------------------------------------------------

enum Api {
  API_UNSPECIFIED = 0;
  API_IMPORT_ARTIFACT = 1;
  API_INSPECT_ARTIFACT = 2;
  API_DISCOVER_DEVICES = 3;
  API_PROBE_DEVICE = 4;
  API_MATERIALIZE_PLAN = 5;
  API_START_EXECUTION = 6;
  API_WATCH_JOB = 7;
  API_CANCEL_JOB = 8;
  API_RECONCILE_JOB = 9;
  API_PLAN_SUPERSEDING_RECOVERY = 10;
  API_GET_RECOVERY_GUIDE = 11;
  // The authority answers an admission the daemon asked for on the watchJob
  // stream. Controller sessions only.
  API_SUBMIT_STEP_PERMIT = 12;
  // The authority reports what its own device control channel observed, for a
  // managed control action the daemon asked for on the watchJob stream.
  API_SUBMIT_MANAGED_CONTROL_RECEIPT = 13;
}

message Request {
  string request_id = 1;
  Api api = 2;
  // Encoded payload for `api`. Kept opaque so one framing serves every call.
  bytes payload = 3;
}

message Response {
  string request_id = 1;
  Api api = 2;
  Status status = 3;
  bytes payload = 4;
  // Position in a streamed response; 0 for a single reply.
  uint64 stream_sequence = 5;
  bool stream_end = 6;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  // The request was understood and refused.
  STATUS_REFUSED = 2;
  // The capability does not exist in this build. Used for every execute-side
  // API in the AF-V1 read-only vertical.
  STATUS_UNAVAILABLE = 3;
  STATUS_INVALID_ARGUMENT = 4;
  STATUS_NOT_FOUND = 5;
  STATUS_INTERNAL = 6;
}

message Error {
  string code = 1;
  string message = 2;
}

// ---------------------------------------------------------------------------
// Payloads
// ---------------------------------------------------------------------------

message ImportArtifactRequest {
  uint64 expected_size_bytes = 1;
  // Lowercase hex, when the authority already knows it.
  string expected_sha256 = 2;
}

message ImportArtifactResponse {
  string artifact_id = 1;
  string sha256 = 2;
  uint64 size_bytes = 3;
  bool deduplicated = 4;
}

message InspectArtifactRequest {
  string artifact_id = 1;
}

message ArchiveMember {
  string path = 1;
  uint64 size_bytes = 2;
  string sha256 = 3;
  string role = 4;
}

message PartitionEntry {
  uint32 index = 1;
  string name = 2;
  uint64 offset_sectors = 3;
  // Absent for a remainder partition.
  uint64 size_sectors = 4;
  bool has_size = 5;
  string attribute = 6;
  string grammar_branch = 7;
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message InspectArtifactResponse {
  string format_id = 1;
  string content_sha256 = 2;
  uint64 size_bytes = 3;
  repeated ArchiveMember members = 4;
  repeated PartitionEntry partitions = 5;
  repeated KeyValue build_facts = 6;
  repeated string unclassified_members = 7;
  repeated KeyValue execution_relevant_unknowns = 8;
  string confidence = 9;
  string manifest_sha256 = 10;
}

message DiscoverDevicesRequest {
  repeated string modes = 1;
  repeated string provider_ids = 2;
  string minimum_identity_strength = 3;
  uint64 deadline_epoch_ms = 4;
}

message DeviceObservationMessage {
  string observation_id = 1;
  uint64 observed_at_epoch_ms = 2;
  string mode = 3;
  string topology_sha256 = 4;
  string descriptor_sha256 = 5;
  string identity_strength = 6;
  bool malformed_descriptor = 7;
  repeated KeyValue protocol_identity = 8;
}

message DiscoverDevicesResponse {
  repeated DeviceObservationMessage observations = 1;
}

message ProbeDeviceRequest {
  string observation_id = 1;
  string profile_id = 2;
}

message ProbeDeviceResponse {
  DeviceObservationMessage observation = 1;
  repeated KeyValue protocol_facts = 2;
  string profile_id = 3;
  string facts_sha256 = 4;
}

message MaterializePlanRequest {
  string artifact_id = 1;
  string profile_id = 2;
  string observation_id = 3;
  string intent = 4;
  string toolchain_id = 5;
}

message PublicStepMessage {
  string step_id = 1;
  string kind = 2;
  string effect = 3;
  string cancellation = 4;
  string binding = 5;
  string semantic_target = 6;
  string content_sha256 = 7;
  string expected_mode_before = 8;
  string expected_mode_after = 9;
  string private_action_sha256 = 10;
}

message EffectMessage {
  string kind = 1;
  string target = 2;
  uint64 range_start = 3;
  uint64 range_length = 4;
  string content_sha256 = 5;
}

message MaterializePlanResponse {
  // Exactly one of `plan` or `assessment` is set.
  ExecutablePlan plan = 1;
  Assessment assessment = 2;
}

message ExecutablePlan {
  string plan_id = 1;
  string plan_sha256 = 2;
  string provider_execution_plan_sha256 = 3;
  string public_projection_sha256 = 4;
  repeated PublicStepMessage public_steps = 5;
  repeated EffectMessage persistent_effects = 6;
  repeated EffectMessage transient_effects = 7;
  repeated KeyValue data_impact = 8;
  uint64 expires_at_epoch_ms = 9;
}

message Assessment {
  // An assessment carries no plan id and no plan digest, by construction.
  repeated PublicStepMessage would_be_steps = 1;
  repeated EffectMessage known_persistent_effects = 2;
  repeated KeyValue unknowns = 3;
  repeated KeyValue evidence_requirements = 4;
  string availability = 5;
  string unavailable_reason = 6;
  repeated KeyValue data_impact = 7;
}

message StartExecutionRequest {
  // Internal identifiers only. No partition, address, tool, FDL, timeout or
  // effect override exists in this message (architecture.md 15.3).
  string plan_id = 1;
  string plan_sha256 = 2;
  string execution_purpose = 3;
  string controller_session_id = 4;
}

message StartExecutionResponse {
  string job_id = 1;
}

// ---------------------------------------------------------------------------
// Execution (architecture.md 8, 9.2, 13)
// ---------------------------------------------------------------------------
//
// The daemon never calls out. It asks on the `watchJob` stream and waits for
// the authority to call back in, which keeps every message client-initiated
// and leaves the authority free to answer, refuse, or simply stop.
//
// The permit itself is NOT re-encoded field by field on the wire. It travels
// as the exact canonical CBOR bytes the authority signed, because a permit
// re-encoded by a second codec is a different permit, and "the same permit"
// is what the integrity tag exists to pin down (architecture.md 8.6).

message WatchJobRequest {
  string job_id = 1;
  // Resume a stream after a reconnect. 0 means "from the beginning".
  uint64 from_sequence = 2;
}

enum JobEventKind {
  JOB_EVENT_KIND_UNSPECIFIED = 0;
  JOB_EVENT_KIND_STATE_CHANGED = 1;
  // The daemon needs a permit. Carries the admission snapshot.
  JOB_EVENT_KIND_STEP_ADMISSION_REQUESTED = 2;
  // The daemon needs the authority to act on its own control channel.
  JOB_EVENT_KIND_MANAGED_CONTROL_REQUESTED = 3;
  JOB_EVENT_KIND_ACTION_RECEIPT = 4;
  JOB_EVENT_KIND_STEP_CHECKPOINTED = 5;
  JOB_EVENT_KIND_POSTFLIGHT_RECORDED = 6;
  JOB_EVENT_KIND_OUTCOME_CLASSIFIED = 7;
  JOB_EVENT_KIND_POSSIBLE_EFFECT_SET = 8;
  JOB_EVENT_KIND_RECOVERY_ASSESSMENT = 9;
}

message JobEvent {
  string job_id = 1;
  // Monotonic within one job, and equal to the journal sequence that produced
  // it. A gap means the authority missed an event, not that none happened.
  uint64 sequence = 2;
  JobEventKind kind = 3;
  uint64 at_epoch_ms = 4;
  // The journal record digest this event was published from, so an authority
  // can tie what it saw to what the daemon durably recorded.
  bytes journal_record_sha256 = 5;
  // Set for STATE_CHANGED.
  string job_state = 6;
  // Set for STEP_ADMISSION_REQUESTED.
  StepAdmissionSnapshot admission = 7;
  // Set for MANAGED_CONTROL_REQUESTED.
  ManagedControlRequest control_request = 8;
  // Set for ACTION_RECEIPT.
  ActionReceiptSummary receipt = 9;
  // Set for OUTCOME_CLASSIFIED / POSSIBLE_EFFECT_SET / RECOVERY_ASSESSMENT.
  repeated KeyValue facts = 10;
}

// What the daemon read immediately before asking (architecture.md 8.3).
//
// The authority re-verifies these against its own binding before it signs. A
// snapshot that is merely echoed back has proved nothing.
message StepAdmissionSnapshot {
  string job_id = 1;
  string plan_id = 2;
  bytes plan_sha256 = 3;
  string step_id = 4;
  string attempt_id = 5;
  bytes public_step_sha256 = 6;
  bytes private_action_sha256 = 7;
  bytes effect_set_sha256 = 8;
  // Digest over the device facts the daemon observed in this snapshot. The
  // facts themselves are not sent: the authority holds the binding they are
  // checked against.
  bytes admitted_device_facts_sha256 = 9;
  string observed_mode = 10;
  uint64 observed_at_epoch_ms = 11;
  // How long this snapshot may be signed against, from `observed_at_epoch_ms`.
  // Past it the daemon takes a new snapshot rather than accepting a late
  // permit (architecture.md 8.3).
  uint64 snapshot_lifetime_ms = 12;
  string request_id = 13;
}

message SubmitStepPermitRequest {
  string job_id = 1;
  // Which admission this answers. Must equal the snapshot's request_id.
  string request_id = 2;
  // Exactly one of the two below.
  //
  // The permit as canonical CBOR — the bytes the authority signed, unchanged.
  bytes permit_cbor = 3;
  bytes integrity_tag = 4;
  uint64 pairing_epoch = 5;
  // Set instead when the authority declines. A refusal is an answer; silence
  // is not, and the daemon distinguishes them.
  string refusal = 6;
}

message SubmitStepPermitResponse {
  // What the daemon did with it. `accepted` false always carries a reason, and
  // never means "retry with the same permit".
  bool accepted = 1;
  string rejection_code = 2;
  string rejection_message = 3;
}

// architecture.md 9.2. ArkForge names a semantic action and receives nothing
// that could reach the device directly.
enum ManagedControlAction {
  MANAGED_CONTROL_ACTION_UNSPECIFIED = 0;
  MANAGED_CONTROL_ACTION_ENTER_UPDATER = 1;
  MANAGED_CONTROL_ACTION_REBOOT_TO_NORMAL = 2;
  MANAGED_CONTROL_ACTION_READ_PRODUCT_FACTS = 3;
  MANAGED_CONTROL_ACTION_READ_BUILD_FACTS = 4;
}

message ManagedControlRequest {
  string job_id = 1;
  string step_id = 2;
  string request_id = 3;
  ManagedControlAction action = 4;
  // The permit that authorizes the step this action belongs to, by id. The
  // daemon has already verified it; the authority checks it is its own.
  string permit_id = 5;
  // Facts the authority must confirm, for a postflight read. Empty otherwise.
  repeated KeyValue expected_facts = 6;
  uint64 deadline_epoch_ms = 7;
}

message SubmitManagedControlReceiptRequest {
  string job_id = 1;
  string request_id = 2;
  ManagedControlAction action = 3;
  // False means the authority's own semantic success was not observed. It does
  // NOT mean nothing happened: a mode change may have taken effect and gone
  // unobserved, which the daemon records as an unknown outcome.
  bool accepted = 4;
  // Facts the authority observed. `connectKey`, executable paths, endpoints,
  // argv, shells and server lifecycle actions must never appear here
  // (architecture.md 9.2); the daemon rejects the receipt if one does.
  repeated KeyValue facts = 5;
  bytes evidence_sha256 = 6;
  string failure_reason = 7;
}

message SubmitManagedControlReceiptResponse {
  bool accepted = 1;
  string rejection_code = 2;
  string rejection_message = 3;
}

// What the daemon tells the authority happened (architecture.md 12.4).
message ActionReceiptSummary {
  string job_id = 1;
  string plan_id = 2;
  string step_id = 3;
  string action_id = 4;
  string attempt_id = 5;
  string permit_id = 6;
  // semanticSuccess | confirmedNoEffect | confirmedPartialEffect |
  // outcomeUnknown. A zero exit status is not a disposition and is not sent.
  string disposition = 7;
  bytes evidence_sha256 = 8;
  // verified | typedSkip | failed. Absent for a step that verifies nothing.
  string verification_outcome = 9;
  // fullHash | sampledRanges | prefixHash | semanticOnly. Absent unless
  // `verification_outcome` is `verified` — a typed skip is never any strength.
  string verification_strength = 10;
  uint64 verified_range_start = 11;
  uint64 verified_range_length = 12;
  // skipped-lba-read-window | profile-declares-unreachable.
  string typed_skip_reason = 13;
  // content-mismatch | erased-medium-filler.
  string failure_classification = 14;
  repeated KeyValue facts = 15;
}
