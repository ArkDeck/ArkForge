# DAYU600 research transcript — SYNTHETIC. NOT EVIDENCE.
#
# Provenance: synthetic.
#
# Nothing in this file was observed on a device. It is hand-written so the
# DAYU600 read-only path — discover, open, probe, assess — can be exercised
# without hardware, and so the wrong-device tests have something to be wrong
# about.
#
# `TranscriptProvenance::supports_protocol_claims()` returns false for this
# provenance, and `crates/arkforge-provider/tests/dayu600_vertical.rs` asserts
# it. Concretely, this file may NOT be cited for:
#
#   - the download-mode USB identity (UNI-U05) — the digests below are derived
#     from strings, not read from a descriptor;
#   - a stable chip identifier (UNI-U06);
#   - any protocol request, ACK, error or timeout (UNI-U07);
#   - anything at all about the PAC format (UNI-U01).
#
# When a real DAYU600 is available, the capture that replaces this file will
# carry `provenance: captured`, and that single word is what changes whether it
# can back a claim (architecture.md 11.4, 24.1).
#
# The `hdc-normal` observation is the one mode with a real basis: AD-004 records
# that `param get ohos.boot.hardware` answers `uis7885` over HDC on DAYU600.
# Even there, the identity digests here are synthetic.

