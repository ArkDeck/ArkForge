name: Fuzz nightly

on:
  schedule:
    # 07:00 UTC. Five minutes per target, after the per-push smoke in fuzz.yml.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal --component rust-src --no-self-update
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Longer libFuzzer run
        working-directory: fuzz
        run: |
          set -euo pipefail
          for target in tar deflate cbor protobuf artifact-import profile; do
            echo "fuzzing ${target}"
            cargo +nightly fuzz run "$target" -- -max_total_time=300 -timeout=10 -max_len=65536 -rss_limit_mb=2048
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-nightly-crashes-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fuzz/artifacts
            fuzz/**/crash-*
            fuzz/**/oom-*
            fuzz/**/timeout-*
            fuzz/**/leak-*
          if-no-files-found: ignore
