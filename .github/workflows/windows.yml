name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Update workspace Rust toolchain
        # Without an explicit channel, rustup can reuse the runner's stale stable install.
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - name: Show Rust toolchain
        run: rustc --version --verbose
      - name: Format
        run: cargo fmt --all -- --check
      - name: Preboot shell compatibility
        shell: bash
        run: sh scripts/test-preboot-holder.sh
      - name: Preboot init handoff
        shell: bash
        run: python scripts/test-preboot-init.py
      - name: Preboot report storage guard
        shell: bash
        run: python scripts/test-preboot-report.py
      - name: Boot-loop restoration orchestration
        run: python -m unittest discover -s scripts -p test_restore_boot_loop.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test native Windows workspace
        run: cargo test --workspace --all-targets
      - name: Parse release PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem packaging/windows -File | Where-Object { $_.Extension -in @('.ps1', '.psm1') } | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Test acceptance and release bundle guards without hardware
        shell: pwsh
        run: |
          & .\packaging\windows\Test-WindowsAcceptanceContract.ps1
          & .\packaging\windows\Test-ReleaseBundle.ps1
          & .\packaging\windows\Test-HdcPackage.ps1
          & .\packaging\windows\Test-DriverCatalog.ps1
          & .\packaging\windows\Test-InboxWinUsb.ps1
