name: Fuzz

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal --component rust-src --no-self-update
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Time-boxed libFuzzer smoke
        working-directory: fuzz
        run: |
          set -euo pipefail
          # Short on purpose: enough to compile every target and exercise the
          # seed plus a few thousand executions. Not an overnight campaign.
          for target in tar deflate cbor protobuf artifact-import profile; do
            echo "fuzzing ${target}"
            cargo +nightly fuzz run "$target" -- -max_total_time=15 -timeout=5 -max_len=4096 -rss_limit_mb=2048
          done
