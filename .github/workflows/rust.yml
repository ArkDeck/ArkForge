name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Rust workspace
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update workspace Rust toolchain
        # Without an explicit channel, rustup can reuse the runner's stale stable install.
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - name: Show Rust toolchain
        run: rustc --version --verbose
      - name: Format
        run: cargo fmt --all -- --check
      - name: Preboot shell compatibility
        run: sh scripts/test-preboot-holder.sh
      - name: Preboot init handoff
        run: python3 scripts/test-preboot-init.py
      - name: Preboot report storage guard
        run: python3 scripts/test-preboot-report.py
      - name: Boot-loop restoration orchestration
        run: python3 -m unittest discover -s scripts -p test_restore_boot_loop.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Swift SDK tests
        run: swift test
