# Synthetic failure transcript — DAYU200 bulk write ends mid-transfer.
#
# Provenance: synthetic. This is not a capture and not a published receipt.
# It exists so replay tests can see a disconnect during flash-partitions
# without treating that record as a completed write. Nothing here is evidence
# of how RockUSB behaves on a board.

schemaVersion: arkforge.transcript/v1

transcript:
  id: SYN-DAYU200-MID-TRANSFER-DISCONNECT
  provenance: synthetic
  source: "synthetic mid-transfer disconnect; no device was measured"
  profileId: org.openharmony.dayu200

records:
