# ArkForge Spec v1 — stable code registry
#
# schema: arkforge.error-registry/v1
# status: draft — every `code` is a literal found in the reference implementation
#         (`source` names the file); `condition` and `retry` are curated for the
#         codes a port must reproduce and abbreviated for the long tail.
#
# retry: retry-same | new-permit | new-plan | operator | never
#   never     — a protocol/invariant violation; retrying the same input cannot succeed
#   operator  — needs a human/agent decision (different input, environment fix)
#
# Codes emitted by `format!` rather than a literal do not exist in this
# implementation: every code is a literal, so a port can enumerate them.
schema: arkforge.error-registry/v1
status: draft

surfaces:
  - id: cli
    description: "`arkforge` CLI: `arkforge.command-result/v1` → `error.code`"
    source: crates/arkforge-cli/src/main.rs CliError
  - id: application
    description: "standalone application service (CLI/ArkFlash DTO layer): `ApplicationError.code`"
    source: crates/arkforge-standalone/src/application/dto.rs ApplicationError
  - id: supervisor
    description: "standalone authority supervisor (local authority + daemon lifecycle)"
    source: crates/arkforge-standalone/src/supervisor.rs
  - id: hdc
    description: "standalone managed HDC control port"
    source: crates/arkforge-standalone/src/hdc_control.rs
  - id: ipc-error
    description: "daemon IPC: `Error.code` inside a non-OK `Response.payload`"
    source: crates/arkforged/src/service.rs
  - id: job
    description: "daemon job registry: surfaced as `SubmitStepPermitResponse.rejection_code`, `SubmitManagedControlReceiptResponse.rejection_code`, or an ipc-error"
    source: crates/arkforged/src/jobs.rs JobError::code
  - id: rescue
    description: "daemon rescue surface (`arkforge rescue …`)"
    source: crates/arkforged/src/rescue.rs
  - id: packaging
    description: "macOS signing/packaging contract checks (AFD-0003)"
    source: crates/arkforged/src/packaging.rs
  - id: artifact
    description: "artifact parser codes, carried inside ARTIFACT_REJECTED and in inspection results"
    source: crates/arkforge-artifact/src/tar.rs ArchiveError::code
  - id: handshake-blocker
    description: "`HelloAck.execution_blockers` and `EXECUTION_DISABLED` details"
    source: crates/arkforge-engine/src/lib.rs ExecutionBlocker::code
  - id: client
    description: "typed IPC client (`arkforge-client`) errors"
    source: crates/arkforge-client/src

spec_classes:
  # Error *classes* the spec names for ports and codecs. The reference
  # implementation represents them as enum variants (see `source`), not as
  # string literals; a port MUST expose them as stable names in its own
  # idiom (error union tag, enum class) and MUST NOT collapse two into one.
  - family: cbor
    description: "canonical CBOR decoder/encoder classes (AF-DIG-006/007)"
    source: crates/arkforge-core/src/digest/cbor.rs CborError
    classes: [CBOR_NEGATIVE_NOT_NEGATIVE, CBOR_DUPLICATE_MAP_KEY, CBOR_TRUNCATED, CBOR_NON_CANONICAL_HEAD, CBOR_UNSUPPORTED_MAJOR_TYPE, CBOR_UNSUPPORTED_SIMPLE_VALUE, CBOR_INDEFINITE_LENGTH, CBOR_UNSORTED_MAP_KEYS, CBOR_INVALID_UTF8, CBOR_TRAILING_BYTES, CBOR_DEPTH_LIMIT]
  - family: pb
    description: "Protobuf wire decoder classes (AF-IPC-012..016)"
    source: crates/arkforge-ipc/src/wire.rs WireError
    classes: [PB_TRUNCATED, PB_VARINT_TOO_LONG, PB_UNSUPPORTED_WIRE_TYPE, PB_FIELD_ZERO, PB_INVALID_UTF8, PB_LENGTH_OVERFLOW, PB_DEPTH_LIMIT, PB_TRAILING_BYTES, PB_UNKNOWN_ENUM_VALUE, PB_FRAME_TOO_LARGE, PB_MISSING_FIELD]
  - family: journal
    description: "journal replay classes (AF-JRN-010..017)"
    source: crates/arkforge-engine/src/{journal,durable}.rs JournalError, DurableJournalError
    classes: [JOURNAL_IO, JOURNAL_NOT_A_JOURNAL, JOURNAL_FRAME_LENGTH_INVALID, JOURNAL_RECORD_TOO_LARGE, JOURNAL_SEQUENCE_BROKEN, JOURNAL_CHAIN_BROKEN, JOURNAL_RECORD_TAMPERED, JOURNAL_FSYNC_POLICY_MISDECLARED, JOURNAL_UNKNOWN_SCHEMA_VERSION, JOURNAL_RECORD_MALFORMED, JOURNAL_CBOR]
  - family: permit-verify
    description: "permit verification and decoding classes (AF-AUTH-013..022)"
    source: crates/arkforge-authority-api/src/lib.rs PermitVerificationError, PermitDecodeError
    classes: [PERMIT_INTEGRITY_TAG_INVALID, PERMIT_STALE_PAIRING_EPOCH, PERMIT_EXPIRED, PERMIT_ACTION_MISMATCH, PERMIT_PLAN_MISMATCH, PERMIT_CONTEXT_MISMATCH, PERMIT_ALREADY_CONSUMED, PERMIT_NOT_SINGLE_USE, PERMIT_CBOR, PERMIT_DECODE_NOT_A_MAP, PERMIT_DECODE_FIELD, PERMIT_DECODE_NOT_CANONICAL, PERMIT_DECODE_CBOR]
  - family: usb
    description: "USB port error classes (ports/usb.md)"
    source: crates/arkforge-usb/src/lib.rs UsbError
    classes: [USB_UNSUPPORTED_PLATFORM, USB_ENUMERATION, USB_NO_MATCHING_INTERFACE, USB_NO_EXACT_INTERFACE, USB_AMBIGUOUS_INTERFACES, USB_CLAIM, USB_MISSING_BULK_PIPE, USB_TRANSFER, USB_TRANSFER_TOO_LARGE, USB_SHORT_TRANSFER]
  - family: transport
    description: "transport port error classes (ports/transport-identity.md)"
    source: crates/arkforge-transport/src/lib.rs TransportError
    classes: [TRANSPORT_NO_DEVICE, TRANSPORT_AMBIGUOUS, TRANSPORT_CLOSED, TRANSPORT_UNSUPPORTED, TRANSPORT_EVIDENCE, TRANSPORT_CBOR]

