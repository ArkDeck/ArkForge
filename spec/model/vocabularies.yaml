  - id: freshness-verdict
    source: crates/arkforge-authority-api/src/lib.rs FreshnessVerdict
    fixture: AF-CONF-ADMISSION-003..015
    values: [fresh, staleSnapshot, continuityBroken]

  - id: continuity-break
    source: crates/arkforge-authority-api/src/lib.rs ContinuityBreak
    fixture: AF-CONF-ADMISSION-006..015
    values: [sessionChanged, detachObserved, deviceFactsChanged, providerFactsChanged, toolchainFactsChanged, artifactFactsChanged]

  - id: permit-disposition
    source: crates/arkforge-engine/src/recovery.rs PermitDisposition
    fixture: AF-CONF-CRASH-001..020
    values: [unseen, acceptedIntentNotDurable, intentDurable, consumingOutcomeUnknown, consumed]

  - id: crash-disposition
    source: crates/arkforge-engine/src/recovery.rs CrashDisposition
    fixture: AF-CONF-CRASH-001..021
    values: [noJob, safeToCancel, dispatchForbiddenUntilIntentDurable, outcomeUnknown, receiptDurableCheckpointMissing, replayFromCheckpoint, concluded]

  - id: managed-control-action
    source: crates/arkforge-ipc/src/messages.rs ManagedControlAction::as_str; proto ManagedControlAction
    fixture: AF-CONF-PB-018
    values:
      - wire: 1
        text: enter-updater
      - wire: 2
        text: reboot-to-normal
      - wire: 3
        text: read-product-facts
      - wire: 4
        text: read-build-facts

  - id: forbidden-control-receipt-fact-key
    source: crates/arkforge-ipc/src/messages.rs FORBIDDEN_CONTROL_RECEIPT_FACTS
    fixture: AF-CONF-PB-018
