        symbol: arkforge_core::plan::{FlashPlanEnvelope::seal, recompute_digest, verify_self_digest, digest_body_bytes, is_expired_at}; arkforge_engine::PlanStore::get
        tests: [crates/arkforge-core/src/plan.rs tests, crates/arkforge-engine/src/lib.rs tests]
