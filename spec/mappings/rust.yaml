# Traceability: requirement → Rust symbol → test (reference implementation)
#
# schema: arkforge.mapping/v1
# status: informative. The Rust implementation is not the spec; this table says
# where each requirement lives in it and which test exercises it, so a reviewer
# can check the spec against the code and a port author can read one symbol
# instead of a crate.
schema: arkforge.mapping/v1
implementation: rust
status: informative
workspace: Cargo.toml (edition 2024, no third-party runtime dependencies — AFD-0001)
dependency_policy: vendored SHA-256, CBOR, DEFLATE, tar, Protobuf wire codec; unsafe only in arkforge-usb and arkforge-platform
durability_level: fsync(2) / FlushFileBuffers — not F_FULLFSYNC (AD-017)

areas:
  - area: DIG
    symbols:
      - req: AF-DIG-001
        symbol: arkforge_core::digest::sha256::Sha256
        tests: [crates/arkforge-core/src/digest/sha256.rs tests]
      - req: AF-DIG-002
        symbol: arkforge_core::digest::hmac_sha256
        tests: [crates/arkforge-core/src/digest/mod.rs hmac_tests::rfc4231_vectors]
      - req: AF-DIG-003..007
        symbol: arkforge_core::digest::cbor::{CborValue, decode_canonical, CborError}
        tests: [crates/arkforge-core/src/digest/cbor.rs tests, arkforge-conformance canonical-cbor suite]
      - req: AF-DIG-008
        symbol: arkforge_core::digest::{Domain, digest_in_domain, digest_canonical}
        tests: [crates/arkforge-core/src/digest/mod.rs tests::domains_are_distinct_and_nul_terminated]
      - req: AF-DIG-009
        symbol: arkforge_core::digest::digest_ordered
      - req: AF-DIG-010
        symbol: arkforge_core::digest::constant_time_eq
