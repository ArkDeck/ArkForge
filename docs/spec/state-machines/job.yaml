# ArkForge Spec v1 — job state machine
#
# schema: arkforge.state-machine/v1
# status: draft — the `states` and `transitions[].legal` facts are normative
#         (fixture AF-CONF-STATEMACHINE-001); the `trigger`, `journal_*` and
#         `exercised_by_daemon` facts are extracted from the reference daemon
#         (crates/arkforged/src/jobs.rs) and are draft.
#
# The Mermaid diagram in docs/architecture.md §13.1 is generated by review
# against this same closed edge table; fixture AF-CONF-STATEMACHINE-001 wins.
#
# Reading guide:
#   journal_before — records appended (with fsync policy) before the state
#                    changes; all durable ones have returned before the move.
#   external_effect — whether the device may be touched during/after the edge.
schema: arkforge.state-machine/v1
machine: job
status: draft
source: [crates/arkforge-engine/src/lib.rs JobState::may_transition_to, crates/arkforged/src/jobs.rs JobRegistry]

states:
  - id: planned
    terminal: false
    permits_external_dispatch: false
    cancel: accepted-immediately
  - id: awaitingStart
    terminal: false
    permits_external_dispatch: false
    cancel: accepted-immediately
  - id: preflight
    terminal: false
    permits_external_dispatch: false
    cancel: accepted-immediately
  - id: awaitingPermit
    terminal: false
    permits_external_dispatch: false
    cancel: accepted-immediately
  - id: stepIntentDurable
    terminal: false
    permits_external_dispatch: true
    cancel: queued-to-safe-boundary
  - id: dispatching
    terminal: false
    permits_external_dispatch: false
    cancel: immediate-if-not-handed-to-dispatcher-else-queued
  - id: receiptDurable
    terminal: false
    permits_external_dispatch: false
    cancel: queued-to-safe-boundary
  - id: checkpointed
    terminal: false
    permits_external_dispatch: false
    cancel: concludes-at-this-boundary
  - id: rebindWait
    terminal: false
    permits_external_dispatch: false
    cancel: accepted-immediately
    exercised_by_daemon: true
  - id: postflight
    terminal: false
    permits_external_dispatch: false
    cancel: refused
  - id: succeeded
    terminal: true
    permits_external_dispatch: false
    cancel: already-terminal
  - id: confirmedFailed
    terminal: true
    permits_external_dispatch: false
    cancel: already-terminal
  - id: cancelledSafe
    terminal: true
    permits_external_dispatch: false
    cancel: already-terminal
  - id: outcomeUnknown
    terminal: false
    permits_external_dispatch: false
    cancel: refused-outcome-unknown
  - id: reconciling
    terminal: false
    permits_external_dispatch: false
    cancel: refused
    exercised_by_daemon: true
  - id: recoveryAssessable
    terminal: true
    permits_external_dispatch: false
    cancel: already-terminal

transitions:
  - id: AF-ENG-T-001
    from: planned
    to: awaitingStart
    trigger: startExecution accepted (plan verified, readiness checked, job journal created)
    journal_before: [jobCreated (durable)]
    facts: [jobId, planId, planDigest, totalSteps, controllerSessionId]
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs JobRegistry::start
  - id: AF-ENG-T-002
    from: awaitingStart
    to: preflight
    trigger: immediately after AF-ENG-T-001
    journal_before: []
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs JobRegistry::start
  - id: AF-ENG-T-003
    from: preflight
    to: awaitingPermit
    trigger: submitStepPermit carrying a permit that verified for the pending admission
    guards: [pending admission exists, request_id matches, freshness verdict is fresh, permit verifies against the dispatch intent, permit id unseen in the ledger]
    journal_before: [stepAdmissionRequested (buffered, written when the admission was published)]
    facts: [stepId]
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs JobRegistry::submit_permit
  - id: AF-ENG-T-004
    from: preflight
    to: cancelledSafe
    trigger: cancelJob before any permit has been accepted
    journal_before: [cancellationRequested (durable), outcomeClassified(outcome=cancelledSafe) (durable)]
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs cancel
  - id: AF-ENG-T-008
    from: awaitingPermit
    to: stepIntentDurable
    trigger: permit accepted
    journal_before: [stepPermitAccepted (durable), stepIntentRecorded (durable)]
    facts: [permitId, jobId, stepId, attemptId]
    external_effect: none
    notes: after stepIntentRecorded returns, everything downstream must assume the device may be touched
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs JobRegistry::submit_permit
  - id: AF-ENG-T-009
    from: awaitingPermit
    to: cancelledSafe
    trigger: the authority refused the admission (SubmitStepPermitRequest.refusal), or cancelJob before any permit
    journal_before: [cancellationRequested (durable), outcomeClassified(outcome=cancelledSafe) (durable)]
    facts: [refusal | reason, eventSequence]
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs submit_permit (refusal branch), cancel
  - id: AF-ENG-T-010
    from: stepIntentDurable
    to: dispatching
    trigger: immediately after AF-ENG-T-008; the step's primary action is queued for the dispatcher or issued as a managed control request
    journal_before: [permitConsuming (durable), externalDispatchStarted (durable)]
    facts: [jobId, planId, stepId, attemptId, permitId]
    facts_for_managed_control: [permitId, controlRequestId, controlAction, controlDeadlineEpochMs]
    external_effect: possible-after-this-record
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs JobRegistry::submit_permit
  - id: AF-ENG-T-011
    from: stepIntentDurable
    to: outcomeUnknown
    trigger: crash-derived (engine CrashDisposition) — the daemon never sits in stepIntentDurable across a call boundary
    exercised_by_daemon: false
  - id: AF-ENG-T-012
    from: dispatching
    to: receiptDurable
    trigger: dispatch completed with a settled disposition, or an accepted control receipt completed
    journal_before: [transportEvidenceRecorded (buffered), semanticReceiptRecorded (durable), permitConsumed (durable)]
    facts: [permitId, receiptDigest, receiptBodyHex, receiptEventSequence]
    external_effect: happened
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs complete_dispatch, submit_control_receipt
  - id: AF-ENG-T-013
    from: dispatching
    to: cancelledSafe
    trigger: cancelJob while the dispatch is queued and has not been handed to a dispatcher
    journal_before: [cancellationRequested (durable), outcomeClassified(outcome=cancelledSafe) (durable)]
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs cancel
  - id: AF-ENG-T-014
    from: dispatching
    to: outcomeUnknown
    trigger: dispatch disposition outcomeUnknown; control receipt not accepted; control request deadline expired
    journal_before: [transportEvidenceRecorded (buffered), outcomeClassified(outcome=outcomeUnknown) (durable)]
    facts: [outcome, reason?, eventSequence]
    external_effect: possible
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs complete_dispatch, submit_control_receipt, expire_stale_controls
  - id: AF-ENG-T-015
    from: receiptDurable
    to: checkpointed
    trigger: immediately after AF-ENG-T-012
    journal_before: [stepCheckpointed (durable)]
    facts: [permitId, receiptDigest]
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs complete_dispatch
  - id: AF-ENG-T-016
    from: receiptDurable
    to: outcomeUnknown
    exercised_by_daemon: false
  - id: AF-ENG-T-017
    from: checkpointed
    to: preflight
    trigger: more steps remain and no cancellation is queued
    journal_before: []
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs advance
  - id: AF-ENG-T-018
    from: checkpointed
    to: postflight
    trigger: the last step checkpointed
    journal_before: [outcomeClassified(outcome=succeeded) (durable)]
    facts: [outcome, reason, eventSequence]
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs advance
  - id: AF-ENG-T-019
    from: checkpointed
    to: rebindWait
    trigger: a checkpointed step seals different expected modes before and after, and another step remains
    journal_before: []
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs advance
  - id: AF-ENG-T-020
    from: checkpointed
    to: confirmedFailed
    trigger: the checkpointed step has a conclusive verification failure, confirmedNoEffect, or confirmedPartialEffect disposition
    journal_before: [outcomeClassified(outcome=confirmedFailed, actionDisposition? | failureClassification?) (durable)]
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs complete_dispatch
  - id: AF-ENG-T-021
    from: checkpointed
    to: cancelledSafe
    trigger: a cancellation queued during the in-flight step is honoured at this boundary
    journal_before: [outcomeClassified(outcome=cancelledSafe) (durable)]
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs finish_queued_cancellation
  - id: AF-ENG-T-022
    from: rebindWait
    to: preflight
    trigger: a unique exact session is opened and its identity is re-read in the next expected mode
    journal_before: [rebindObserved (buffered)]
    facts: [jobId, planId, stepId, observationDigest, transportSessionDigest, observedMode]
    external_effect: read-only
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs request_next_admission
  - id: AF-ENG-T-023
    from: rebindWait
    to: outcomeUnknown
    trigger: daemon restart after a completed step when the remaining continuation cannot be reconstructed
    exercised_by_daemon: false
  - id: AF-ENG-T-007
    from: rebindWait
    to: cancelledSafe
    trigger: cancelJob while waiting for a new exact session; no next permit exists
    journal_before: [cancellationRequested (durable), outcomeClassified(outcome=cancelledSafe) (durable)]
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs cancel
  - id: AF-ENG-T-024
    from: postflight
    to: succeeded
    trigger: immediately after AF-ENG-T-018 (postflight facts were gathered by the postflightProbe step)
    journal_before: []
    external_effect: none
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs advance
  - id: AF-ENG-T-025
    from: postflight
    to: confirmedFailed
    exercised_by_daemon: false
  - id: AF-ENG-T-026
    from: outcomeUnknown
    to: reconciling
    trigger: reconcileJob derives a bounded possible-effect set and the provider selects a sealed read-only plan
    journal_before: [possibleEffectSetRecorded (durable)]
    external_effect: read-only
    exercised_by_daemon: true
    source: crates/arkforged/src/jobs.rs begin_reconcile, service.rs reconcile_job
  - id: AF-ENG-T-027
    from: outcomeUnknown
    to: recoveryAssessable
    exercised_by_daemon: false
  - id: AF-ENG-T-028
    from: reconciling
    to: succeeded
    trigger: read-only observations prove the complete terminal contract
    journal_before: [readOnlyObservationRecorded (buffered), recoveryAssessmentPublished (durable), outcomeClassified(outcome=succeeded) (durable)]
    exercised_by_daemon: true
  - id: AF-ENG-T-029
    from: reconciling
    to: confirmedFailed
    trigger: observations prove confirmedNotExecuted or confirmedPartial
    journal_before: [readOnlyObservationRecorded (buffered), recoveryAssessmentPublished (durable), outcomeClassified(outcome=confirmedFailed) (durable)]
    exercised_by_daemon: true
  - id: AF-ENG-T-030
    from: reconciling
    to: outcomeUnknown
    trigger: observations are empty, indeterminate, or do not cover the complete terminal scope
    journal_before: [readOnlyObservationRecorded (buffered), recoveryAssessmentPublished (durable), outcomeClassified(outcome=outcomeUnknown) (durable)]
    exercised_by_daemon: true

# Every (from, to) pair not listed above is illegal and must be refused with
# ILLEGAL_TRANSITION. 29 edges; fixture AF-CONF-STATEMACHINE-001.

permit_consumption:
  # The typed order. Each stage consumes the previous by value in the reference
  # implementation; what the spec requires is the observable journal order.
  - stage: admit
    records: [stepPermitAccepted (durable), stepIntentRecorded (durable)]
    precondition: ledger disposition of the permit id is unseen
  - stage: begin_dispatch
    records: [permitConsuming (durable), externalDispatchStarted (durable)]
  - stage: transport_evidence
    records: [transportEvidenceRecorded (buffered)]
  - stage: record_receipt
    records: [semanticReceiptRecorded (durable), permitConsumed (durable)]
  - stage: checkpoint
    records: [stepCheckpointed (durable)]

restart:
  # What the reference daemon does when it opens a job journal at startup
  # (crates/arkforged/src/jobs.rs recover_job). See also crash-disposition.yaml.
  policy: conclude-never-resume
  rules:
    - when: an outcomeClassified record exists
      state: the first terminal outcome when present (succeeded | confirmedFailed | cancelledSafe | recoveryAssessable), otherwise outcomeUnknown
      appends: nothing
    - when: crash disposition is safeToCancel or dispatchForbiddenUntilIntentDurable
      state: cancelledSafe
      appends: outcomeClassified(outcome=cancelledSafe)
    - when: crash disposition is outcomeUnknown (intentDurable or consumingOutcomeUnknown)
      state: outcomeUnknown
      appends: outcomeClassified(outcome=outcomeUnknown, reason="daemon restarted with a durable external intent and no settled receipt")
    - when: crash disposition is receiptDurableCheckpointMissing
      state: outcomeUnknown
      appends: outcomeClassified(outcome=outcomeUnknown, reason="durable receipt exists but its checkpoint is missing; receipt replay is not job completion")
    - when: crash disposition is replayFromCheckpoint and no durable terminal classification exists
      state: outcomeUnknown
      appends: outcomeClassified(outcome=outcomeUnknown, reason="checkpoint count does not prove a successful terminal disposition")
  apis_after_restart:
    cancel: already-terminal or outcome-unknown
    reconcile: allowed (read-only, answers from the journal)
    planSupersedingRecovery: allowed for outcomeUnknown
    watch: replays only canonically validated durable receipt events, retaining their cursor, followed by the durable classification
