# ArkForge Spec v1 — crash dispositions (architecture.md §13.3 as data)
#
# schema: arkforge.state-machine/v1
# status: normative — fixture AF-CONF-CRASH-001..021 pins every row.
# source: crates/arkforge-engine/src/recovery.rs CrashDisposition::derive, PermitLedger
#
# Derivation for job J over its replayed records. An explicit jobId fact is
# authoritative; otherwise subject == J counts. For a one-job journal, legacy
# untagged step-scoped records also belong to its sole job:
#   1. no jobCreated record            → noJob
#   2. first outcomeClassified whose `outcome` is a terminal state → concluded(state)
#   3. newest record carrying a permitId fact names permit P; if none → safeToCancel
#   4. ledger(P):
#        unseen                     → safeToCancel
#        acceptedIntentNotDurable   → dispatchForbiddenUntilIntentDurable(P)
#        intentDurable              → outcomeUnknown(P)
#        consumingOutcomeUnknown    → outcomeUnknown(P)
#        consumed, no stepCheckpointed naming P → receiptDurableCheckpointMissing(P)
#        consumed, checkpointed     → replayFromCheckpoint
#   No row permits a new external effect.
schema: arkforge.state-machine/v1
machine: crash-disposition
status: normative

permit_ledger:
  # The lifecycle is monotonic per permit id. A later earlier-stage record may
  # not downgrade consuming/consumed, and the first non-empty receiptDigest is
  # immutable. A receipt marker without its digest remains unresolved.
  permits_dispatch: [intentDurable]
  unresolved: [intentDurable, consumingOutcomeUnknown]
  records:
    - record: stepPermitAccepted
      disposition: acceptedIntentNotDurable
    - record: stepIntentRecorded
      disposition: intentDurable
    - record: permitConsuming
      disposition: consumingOutcomeUnknown
    - record: externalDispatchStarted
      disposition: consumingOutcomeUnknown
    - record: semanticReceiptRecorded
      disposition: consumed
      facts: [receiptDigest]
    - record: permitConsumed
      disposition: consumed
      facts: [receiptDigest]

rows:
  - id: AF-CRASH-R-001
    disposition: noJob
    when: no jobCreated record for the job
    action: plan and start again; nothing happened
    permits_external_effect: false
    fixtures: [AF-CONF-CRASH-001, AF-CONF-CRASH-002]
  - id: AF-CRASH-R-002
    disposition: safeToCancel
    when: job exists, no record names a permit (or the newest permit is unseen)
    action: safe to pause or cancel
    permits_external_effect: false
    fixtures: [AF-CONF-CRASH-003, AF-CONF-CRASH-004, AF-CONF-CRASH-017]
  - id: AF-CRASH-R-003
    disposition: dispatchForbiddenUntilIntentDurable
    when: newest permit is acceptedIntentNotDurable
    action: record the same intent under the same permit id, or let the permit expire; never create a second intent; never dispatch
    permits_external_effect: false
    fixtures: [AF-CONF-CRASH-005]
  - id: AF-CRASH-R-004
    disposition: outcomeUnknown
    when: newest permit is intentDurable or consumingOutcomeUnknown
    action: reconcile (read-only); never replay
    permits_external_effect: false
    fixtures: [AF-CONF-CRASH-006, AF-CONF-CRASH-007, AF-CONF-CRASH-008]
  - id: AF-CRASH-R-005
    disposition: receiptDurableCheckpointMissing
    when: newest permit has a semantic receipt (with or without the following permitConsumed marker) and no stepCheckpointed names it
    action: replay the receipt only after canonical body, identity and digest validation; classify outcomeUnknown and reconcile read-only; do not synthesize the checkpoint, infer success, or re-execute
    permits_external_effect: false
    fixtures: [AF-CONF-CRASH-009, AF-CONF-CRASH-010]
  - id: AF-CRASH-R-006
    disposition: replayFromCheckpoint
    when: newest permit is consumed and checkpointed
    action: replay validated receipt events to the authority; without a durable terminal outcome classify outcomeUnknown; checkpoint count alone is not success; do not re-execute
    permits_external_effect: false
    fixtures: [AF-CONF-CRASH-011, AF-CONF-CRASH-019]
  - id: AF-CRASH-R-007
    disposition: concluded
    when: an outcomeClassified record names a terminal outcome
    action: report the first durable terminal state; a later classification cannot overwrite it
    permits_external_effect: false
    fixtures: [AF-CONF-CRASH-012, AF-CONF-CRASH-013, AF-CONF-CRASH-014, AF-CONF-CRASH-015, AF-CONF-CRASH-016, AF-CONF-CRASH-021]
  - id: AF-CRASH-R-008
    disposition: (newest permit decides)
    when: several permits are mentioned
    action: derive from the permit named by the newest record carrying permitId
    fixtures: [AF-CONF-CRASH-018, AF-CONF-CRASH-019]
  - id: AF-CRASH-R-009
    disposition: (other jobs ignored)
    when: records for another job share the journal
    action: an explicit fact jobId is authoritative; without it subject identifies the job, with a single-job compatibility fallback for legacy untagged step records
    fixtures: [AF-CONF-CRASH-020]

architecture_13_3_mapping:
  # How the prose table in docs/architecture.md §13.3 maps onto the rows.
  - prose: start 前
    row: AF-CRASH-R-001
  - prose: permit 前
    row: AF-CRASH-R-002
  - prose: ArkDeck intent 已落、permit 传输丢失
    row: authority side; the daemon sees AF-CRASH-R-002 and the authority retransmits the stored permit
  - prose: permit 收到、ArkForge StepIntent 未落
    row: AF-CRASH-R-003
  - prose: StepIntent 已落、dispatch 是否发生不明
    row: AF-CRASH-R-004
  - prose: dispatch 后无 semantic receipt
    row: AF-CRASH-R-004
  - prose: receipt durable、checkpoint 未落
    row: AF-CRASH-R-005
  - prose: checkpoint 已落、ArkDeck 未观察
    row: AF-CRASH-R-006
  - prose: postflight 前崩溃
    row: AF-CRASH-R-006 (read-only postflight/reconcile)
